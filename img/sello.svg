<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="titulo">
  <!-- Sello de calidad SG · versión completa (ADR-007, tono Bosque) -->
  <!-- PENDIENTE (CA-00.5): convertir las letras en trazos con una fuente de licencia libre -->
  <title id="titulo">Sello de calidad de Sebastián González</title>
  <defs>
    <!-- Círculo invisible por donde "camina" el texto del anillo -->
    <path id="anillo" d="M50 50 m-36 0 a36 36 0 1 1 72 0 a36 36 0 1 1 -72 0"/>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#F7F5EF" stroke="#1F4D3A" stroke-width="3"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#B7791F" stroke-width="1"/>
  <circle cx="50" cy="50" r="27" fill="#1F4D3A"/>
  <!-- textLength obliga al texto a ocupar exactamente el anillo, sin encimarse -->
  <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#1F4D3A" textLength="218" lengthAdjust="spacing"><textPath href="#anillo">DESARROLLO WEB · CALIDAD DE SOFTWARE ·</textPath></text>
  <text x="50" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="24" fill="#F7F5EF">SG</text>
</svg>
